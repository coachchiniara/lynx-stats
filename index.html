<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lynx VBFD1">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Lynx Stats – VBFD1 (féminin)</title>
<style>
html,body{margin:0;height:100%;background:#e8e8e8;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
/* Black strip behind the iPhone status bar. The app sits in #wrap right below
   it; a div (unlike a bare iframe) reliably stretches to the bottom edge, and
   any leftover space shows the app's own grey instead of a coloured band. */
#statusbg{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#000;z-index:5}
#wrap{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;bottom:0}
#app{width:100%;height:100%;border:0;display:block;background:#e8e8e8}
#splash{position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;transition:opacity .3s ease}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:120px;height:120px;border-radius:26px}
#splash .msg{color:rgba(255,255,255,.8);font-size:14px;text-align:center;padding:0 30px;min-height:20px}
#splash button{display:none;padding:10px 22px;border-radius:20px;border:1.5px solid #fff;background:transparent;color:#fff;font-size:14px;font-weight:700}
#hint{display:none;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#1a1a1a;color:#fff;border-radius:12px;padding:12px 40px 12px 14px;font-size:13px;line-height:1.35;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#hint b{color:#ff5c5c}
#hint .x{position:absolute;top:6px;right:8px;border:0;background:transparent;color:#fff;font-size:20px;padding:4px 6px}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-180.png" alt="">
  <div class="msg" id="msg">Chargement…</div>
  <button id="retry" onclick="location.reload()">Réessayer</button>
</div>
<div id="statusbg"></div>
<div id="wrap"><iframe id="app" title="Lynx Stats – VBFD1 (féminin)"></iframe></div>
<div id="hint">
  Pour installer l'app : touche <b>Partager</b> puis <b>Sur l'écran d'accueil</b>.
  <button class="x" onclick="dismissHint()">×</button>
</div>
<script src="config.js"></script>
<script>
var APP_URL = window.APP_URL || '';

var splash = document.getElementById('splash');
var msg = document.getElementById('msg');
var frame = document.getElementById('app');

if (APP_URL.indexOf('script.google.com') === -1) {
  msg.textContent = "URL de l'app pas encore configurée.";
} else {
  frame.addEventListener('load', function () { splash.classList.add('gone'); });
  frame.src = APP_URL;
  // Slow gym Wi-Fi: after a while, offer a reload instead of an endless spinner.
  setTimeout(function () {
    if (splash.classList.contains('gone')) return;
    msg.textContent = 'Ça prend du temps… vérifie ta connexion.';
    document.getElementById('retry').style.display = 'inline-block';
  }, 20000);
}

// In plain Safari (not launched from the home screen), show a one-time
// install tip on iPhone.
var standalone = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
var hintSeen = false;
try { hintSeen = localStorage.getItem('lynxHintSeen') === '1'; } catch (e) {}
if (isIOS && !standalone && !hintSeen) document.getElementById('hint').style.display = 'block';
function dismissHint() {
  document.getElementById('hint').style.display = 'none';
  try { localStorage.setItem('lynxHintSeen', '1'); } catch (e) {}
}
</script>
</body>
</html>
