    h += '<tr><td class="lc">#'+PLAYERS[i].num+' '+PLAYERS[i].name+'</td>' +
      '<td>'+p.s0+'</td><td>'+p.s1+'</td><td>'+p.s2+'</td><td>'+p.s3+'</td><td>'+p.sErr+'</td><td>'+TA+'</td>' +
      '<td class="ep">'+score+'</td><td class="'+tierCls(pctNum,40,55)+'">'+pct+'</td></tr>';
  }
  if (tTA > 0 || (tG+tP) > 0) {
    var teamScore = tTA>0 ? ((t1+t2*2+t3*3+tErr*4)/tTA).toFixed(2) : '--';
    var teamPtTot = tG+tP;
    var teamPctNum = teamPtTot>0 ? Math.round(tG/teamPtTot*100) : null;
    var teamPct = teamPctNum===null ? '--' : teamPctNum+'%';
    h += '<tr class="team-row"><td class="lc">EQUIPE</td>' +
      '<td>'+t0+'</td><td>'+t1+'</td><td>'+t2+'</td><td>'+t3+'</td><td>'+tErr+'</td><td>'+tTA+'</td>' +
      '<td>'+teamScore+'</td><td class="'+tierCls(teamPctNum,40,55)+'">'+teamPct+'</td></tr>';
  }
  h += '</tbody></table></div>';
  h += svcPointsByQualityHtml(d);
  return h + '</div>';
}

// Rally outcome by the quality of the serve that started it — answers
// "how often do we win the point after serving a 1?".
function svcPointsByQualityHtml(d) {
  if (!d.svcPtByQuality || d.svcPtByQuality.length < 2) return '';
  var keys = ['s0','s1','s2','s3','sErr'];
  var lbls = ['Ace (0)','1','2','3','Err (4)'];
  var won = [0,0,0,0,0], lost = [0,0,0,0,0], any = false;
  for (var k = 0; k < keys.length; k++) {
    for (var pi = 0; pi < d.svcPtByQuality[0].length; pi++) {
      won[k]  += (d.svcPtByQuality[0][pi] && d.svcPtByQuality[0][pi][keys[k]]) || 0;
      lost[k] += (d.svcPtByQuality[1][pi] && d.svcPtByQuality[1][pi][keys[k]]) || 0;
    }
    if (won[k] + lost[k] > 0) any = true;
  }
  if (!any) return '';

  var h = '<div class="setter-divider">Points gagnes selon la qualite du service</div>' +
    '<div class="ctable-wrap"><table class="ctable"><thead><tr>' +
    '<th class="lc">Qualite</th><th>Gagnes</th><th>Perdus</th><th>Echanges</th><th>% gagnes</th>' +
    '</tr></thead><tbody>';
  var tw = 0, tl = 0;
  for (var k = 0; k < keys.length; k++) {
    var tot = won[k] + lost[k];
    if (tot === 0) continue;
    tw += won[k]; tl += lost[k];
    var pct = Math.round(won[k] / tot * 100);
    h += '<tr><td class="lc">'+lbls[k]+'</td><td>'+won[k]+'</td><td>'+lost[k]+'</td><td>'+tot+'</td>' +
         '<td class="'+(pct >= 50 ? 'ep' : 'en')+'">'+pct+'%</td></tr>';
  }
  var tt = tw + tl;
  if (tt > 0) {
    var tpct = Math.round(tw / tt * 100);
    h += '<tr class="team-row"><td class="lc">TOTAL</td><td>'+tw+'</td><td>'+tl+'</td><td>'+tt+'</td>' +
         '<td>'+tpct+'%</td></tr>';
  }
  return h + '</tbody></table></div>';
}
function renderPhaseBloc(d) {
  var h = '<div class="phase-block"><div class="phase-hdr">Bloc</div><div class="ctable-wrap">' +
    '<table class="ctable" data-sort="bloc"><thead><tr><th class="lc">Joueuse</th><th>Solo</th><th>Ast</th><th>BL+</th><th>BL-</th><th>Err</th><th>TA</th><th>+-</th></tr></thead><tbody>';
  var tSolo=0,tAst=0,tP=0,tM=0,tErr=0,tTA=0;
  for (var i = 0; i < d.players.length; i++) {
    var p=d.players[i], TA=p.blSolo+p.blAssist+p.blP+p.blM+p.blErr; if(TA===0)continue;
    var pm = p.blSolo+p.blAssist*0.5-p.blErr;
    tSolo+=p.blSolo; tAst+=p.blAssist; tP+=p.blP; tM+=p.blM; tErr+=p.blErr; tTA+=TA;
    h += '<tr><td class="lc">#'+PLAYERS[i].num+' '+PLAYERS[i].name+'</td>' +
      '<td>'+p.blSolo+'</td><td>'+p.blAssist+'</td><td>'+p.blP+'</td><td>'+p.blM+'</td><td>'+p.blErr+'</td><td>'+TA+'</td>' +
      '<td class="'+(pm>=0?'ep':'en')+'">'+(pm>=0?'+':'')+pm.toFixed(1)+'</td></tr>';
  }
  if (tTA > 0) {
    var teamPm = tSolo + tAst*0.5 - tErr;
    h += '<tr class="team-row"><td class="lc">EQUIPE</td>' +
      '<td>'+tSolo+'</td><td>'+tAst+'</td><td>'+tP+'</td><td>'+tM+'</td><td>'+tErr+'</td><td>'+tTA+'</td>' +
      '<td>'+(teamPm>=0?'+':'')+teamPm.toFixed(1)+'</td></tr>';
  }
  return h + '</tbody></table></div></div>';
}

// Same "did this player log anything" check the server uses to count sets
// played -- needed here too for the single-set Bilan view, whose data never
// carries a precomputed setsPlayed array (there's only one set to look at).
function clientPlayerHasAnyStat(p) {
  if (!p) return false;
  var keys = ['frK','frCp','frCm','frBLE','frOut','frOtherErr','r3','r2','r1','rErr',
              'brK','brCp','brCm','brBLE','brOut','brOtherErr','s0','s1','s2','s3','sErr',
              'blSolo','blAssist','blP','blM','blErr'];
  for (var i = 0; i < keys.length; i++) if (Number(p[keys[i]]) > 0) return true;
  return false;
}

// Résumé du match / set / groupe : une ligne par joueuse avec les totaux qui
// comptent le plus -- sets joués, service (as/erreurs), attaque (K / erreurs
// "out" seulement, les autres fautes d'attaque ont leur propre colonne plus
// haut) et contres (blocs qui rapportent un point : solo + assist).
function renderMatchSummary(d) {
  var setsPlayed = d.setsPlayed || d.players.map(function(p){ return clientPlayerHasAnyStat(p) ? 1 : 0; });
  var rows = '', any = false;
  var tSets=0,tAce=0,tSvcErr=0,tK=0,tAtkErr=0,tContre=0,tPts=0,tErr=0;
  for (var i = 0; i < d.players.length; i++) {
    var p = d.players[i];
    var sp = setsPlayed[i] || 0;
    var ace = p.s0||0, svcErr = p.sErr||0;
    var k = (p.frK||0)+(p.brK||0), atkErr = (p.frOut||0)+(p.brOut||0);
    // A block point is a full contre solo, a shared (assist) one counts half --
    // same weighting as the +/- score in the Bloc table above, so a team can
    // legitimately finish a match at, say, 3.5 contres.
    var contre = (p.blSolo||0)+(p.blAssist||0)*0.5;
    var pts = ace + k + contre;             // total points won: ace + kill + contre
    var err = svcErr + atkErr;              // total errors: service err + attack "out" err
    if (sp===0 && ace===0 && svcErr===0 && k===0 && atkErr===0 && contre===0) continue;
    any = true;
    tSets+=sp; tAce+=ace; tSvcErr+=svcErr; tK+=k; tAtkErr+=atkErr; tContre+=contre; tPts+=pts; tErr+=err;
    rows += '<tr><td class="lc">#'+PLAYERS[i].num+' '+PLAYERS[i].name+'</td>' +
      '<td>'+sp+'</td><td>'+ace+'</td><td>'+svcErr+'</td><td>'+k+'</td><td>'+atkErr+'</td><td>'+contre.toFixed(1)+'</td>' +
      '<td>'+pts.toFixed(1)+'</td><td>'+err+'</td></tr>';
  }
  if (!any) return '';
  rows += '<tr class="team-row"><td class="lc">EQUIPE</td>' +
    '<td>'+tSets+'</td><td>'+tAce+'</td><td>'+tSvcErr+'</td><td>'+tK+'</td><td>'+tAtkErr+'</td><td>'+tContre.toFixed(1)+'</td>' +
    '<td>'+tPts.toFixed(1)+'</td><td>'+tErr+'</td></tr>';
  return '<div class="phase-block"><div class="phase-hdr">Resume</div><div class="ctable-wrap">' +
    '<table class="ctable" data-sort="resume"><thead><tr><th class="lc">Joueuse</th><th>Sets</th><th>Ace</th><th>Err svc</th>' +
    '<th>K</th><th>Err atq (out)</th><th>Contres</th><th>Total pts</th><th>Total err</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

      h += '</div></div>';
    }
    h += '</div></div>';

var pendingOppWrites = {};
function adjOpp(oi, key, ki, delta) {
  var el = document.getElementById('opp_'+oi+'_'+ki); if (!el) return;
  try {
    if (OPP_AUTO.hasOwnProperty(key)) {
      // A botched reception ends the rally there — no question to ask, and a
      // correction takes the awarded point back.
      sendOppPoint(oi, OPP_AUTO[key], currentMatchId, currentSet, delta > 0 ? 1 : -1);
      clearPendingPoint();
    } else if (delta > 0) {
      var lbl = (stats && stats.oppLabels && stats.oppLabels[oi]) || OPP_DEFAULT_LABELS[oi] || ('Joueur '+(oi+1));
      setPendingPoint('opp', oi, lbl, key);
    }
  } catch(e) {}
  var minusId = 'mo_'+oi+'_'+ki;
  var cur=parseInt(el.textContent)||0, opt=Math.max(0,cur+delta);
  refreshCounterVisual(el, minusId, opt, true);
  if(stats&&stats.opp[oi]) stats.opp[oi][key]=opt;

  var matchAtTap = currentMatchId, setAtTap = currentSet;
  var cellKey = oi+'_'+key;
  var pw = pendingOppWrites[cellKey];
  if (!pw) { pw = pendingOppWrites[cellKey] = { baseVal: cur }; }
  if (pw.timer) clearTimeout(pw.timer);

  pw.timer = setTimeout(function() {
    var netDelta = opt - pw.baseVal;
    delete pendingOppWrites[cellKey];
    if (netDelta === 0) return;
    sendOppStatWrite(matchAtTap, setAtTap, oi, key, netDelta, el, setAtTap, 0, minusId);
  }, 400);
}

function sendOppStatWrite(matchId, setNum, oi, key, netDelta, el, setAtTap, attempt, minusId) {
  google.script.run
    .withSuccessHandler(function(r) {
      if(r&&r.ok){
        el.classList.remove('unsaved');
        noteLocalWrite(matchId, setNum);
        if (matchId === currentMatchId && !setProgress[setAtTap]) {
          setProgress[setAtTap] = true;
          document.querySelectorAll('.set-btn[data-set="'+setAtTap+'"]').forEach(function(b){ b.classList.add('has-data'); });
        }
        // Switched set or match while this was in flight: r.val belongs to
        // the old set and must not land in the numbers now on screen.
        if (matchId !== currentMatchId || setNum !== currentSet) return;
        refreshCounterVisual(el, minusId, r.val, false);
        if(stats&&stats.opp[oi])stats.opp[oi][key]=r.val;
      }
      else showToast(r && r.locked ? 'Match verrouille' : 'Erreur');
    })
    .withFailureHandler(function(e) {
      if (attempt < 2) {
        setTimeout(function() { sendOppStatWrite(matchId, setNum, oi, key, netDelta, el, setAtTap, attempt+1, minusId); }, 1200 * (attempt+1));
      } else {
        el.classList.add('unsaved');
        showToast('Non enregistre — reseau instable');
      }
    })
    .adjustOppStat(matchId, setNum, oi, key, netDelta);
}

function toggleEditMatch(id) {
  editOpenId = (editOpenId === id) ? null : id;
  deleteArmed = null;
  renderCfg();
}
function saveEditMatch(id) {
  var nameInp = document.getElementById('editName_'+id);
  var groupInp = document.getElementById('editGroup_'+id);
  var newName = nameInp ? nameInp.value.trim() : '';
  var newGroup = groupInp ? groupInp.value.trim() : '';
  if (!newName) { showToast('Nom vide'); return; }
  showLoading();
  google.script.run
    .withSuccessHandler(function(r) {
      editOpenId = null;
      groupsCache = null;
      groupDataCache = {};
      // Only refetch the list when the server actually reordered it. A group
      // change or a same-date edit leaves the order untouched, so patching
      // locally avoids reopening every match sheet.
      if (r && r.reordered) {
        loadMatches(function() {
          hideLoading();
          if (id === currentMatchId) updateMatchBtnLabel();
          renderCfg();
          showToast('Enregistre!');
        });
        return;
      }
      var m = matchesCache.filter(function(x){ return x.id === id; })[0];
      if (m) { m.name = newName; m.group = newGroup; }
      hideLoading();
      if (id === currentMatchId) updateMatchBtnLabel();
      renderCfg();
      showToast('Enregistre!');
    })
    .withFailureHandler(function(e) { hideLoading(); showToast('Erreur: '+e.message); })
    .renameMatch(id, newName, newGroup);
}
function toggleMatchLock(id) {
  var m = matchesCache.filter(function(x){return x.id===id;})[0];
  if (!m) return;
  var newLocked = !m.locked;
  showLoading();
  google.script.run
    .withSuccessHandler(function(r) {
      hideLoading();
      m.locked = r.locked;
      if (id === currentMatchId) {
        currentMatchLocked = r.locked;
        updateMatchBtnLabel();
        renderAll();
      }
      renderCfg();
      showToast(r.locked ? 'Match verrouille' : 'Match deverrouille');
    })
    .withFailureHandler(function(e) { hideLoading(); showToast('Erreur: '+e.message); })
    .setMatchLock(id, newLocked);
}
function moveMatch(id, dir) {
  var idx = matchesCache.findIndex(function(m){return m.id===id;});
  if (idx < 0) return;
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= matchesCache.length) return;
  var tmp = matchesCache[idx];
  matchesCache[idx] = matchesCache[newIdx];
  matchesCache[newIdx] = tmp;
  renderCfg();
  var ids = matchesCache.map(function(m){return m.id;});
  google.script.run
    .withFailureHandler(function(e) { showToast('Erreur ordre: '+e.message); })
    .reorderMatches(ids);
}
function handleDeleteClick(id) {
  deleteArmed = id;
  renderCfg();
}
function confirmDeleteMatch(id) {
  deleteArmed = null;
  var wasCurrent = (id === currentMatchId);
  showLoading();
  google.script.run
    .withSuccessHandler(function() {
      hideLoading();
      matchesCache = matchesCache.filter(function(m){return m.id!==id;});
      if (wasCurrent) {
        currentMatchId = matchesCache.length ? matchesCache[0].id : null;
        // The Bilan caches belonged to the deleted match.
        clearBilanCaches();
        if (currentMatchId) { updateMatchBtnLabel(); loadStats(); }
        else {
          // No match left at all: the old stat screen must not linger on
          // screen looking tappable -- a stray tap here used to file into a
          // sheet literally named "null - Set 1" since there was nothing
          // left to attach it to.
          stats = null;
          STAT_TABS.forEach(function(t){ var el = document.getElementById(t); if (el) el.innerHTML = ''; });
          updateMatchBtnLabel();
        }
      }
      renderCfg();
      showToast('Match supprime');

    .withFailureHandler(function(e) { hideLoading(); showToast('Erreur: '+e.message); })
    .deleteMatch(id);
}
function createMatchFromConfig() {

    .withSuccessHandler(function(m) {

    .withFailureHandler(function(e) { hideLoading(); showToast('Erreur: '+e.message); })

// Compares LEAGUE_SCHEDULE against already-loaded matchesCache — no server
// call needed, so the button can hide itself the moment everything's imported.
function countMissingLeagueMatches() {
  var existing = {};
  matchesCache.forEach(function(m) { existing[m.name] = true; });
  var missing = 0;
  LEAGUE_SCHEDULE.forEach(function(name) { if (!existing[name]) missing++; });
  return missing;
}
function seedLeague() {

  google.script.run
    .withSuccessHandler(function(r) {
      hideLoading();
      showToast(r.added + ' match(s) ajoute(s) sur ' + r.total);
      loadMatches(function(){ renderCfg(); });
    })
    .withFailureHandler(function(e) { hideLoading(); showToast('Erreur: '+e.message); })
    .seedLeagueMatches();
}

function saveCfgSetters() {
  var names = [];
  for (var i=0;i<3;i++){var inp=document.getElementById('cfgS'+i);names.push(inp?inp.value:('Passeure '+(i+1)));}
  showLoading();
  google.script.run
    .withSuccessHandler(function(){
      hideLoading();
      if(stats)stats.setters=names;
      staleTabs.atqCombo = false;
      renderPlayerTab('atqCombo');
      showToast('Enregistre!');
    })
    .withFailureHandler(function(e){hideLoading();showToast('Erreur: '+(e&&e.message?e.message:e));})
    .saveSetterNames(names);
}
function saveCfgOppLabels() {
  var visible = oppVisibleCount(stats);
  var labels = (stats && stats.oppLabels) ? stats.oppLabels.slice() : [];
  while (labels.length < 15) labels.push('');
  for(var i=0;i<visible;i++){var inp=document.getElementById('cfgOL_'+i);if(inp)labels[i]=inp.value;}
  showLoading();
  google.script.run
    .withSuccessHandler(function(){hideLoading();if(stats)stats.oppLabels=labels;showToast('Enregistre!');})
    .withFailureHandler(function(e){hideLoading();showToast('Erreur: '+(e&&e.message?e.message:e));})
    .saveOppLabels(currentMatchId, labels);
}
function showToast(msg) {
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function updateTabbarOffset() {
  var hdr = document.getElementById('hdr');
  var tabbar = document.querySelector('.tabbar');
  if (!hdr || !tabbar) return;
  tabbar.style.top = hdr.offsetHeight + 'px';
  // Context selectors stick just below the header + tab bar. Both are sticky
  // with heights that change (the set bar hides on Bilan), so the offset is
  // published as a CSS variable rather than hard-coded.
  document.documentElement.style.setProperty(
    '--stickyTop', (hdr.offsetHeight + tabbar.offsetHeight) + 'px');
}
window.addEventListener('resize', updateTabbarOffset);

function bootstrap() {
  try {
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.matches) { loadMatches(); return; }
        if (!r.matches.length) { onMatchesLoaded([]); return; }
        matchesCache      = r.matches;
        currentMatchId    = r.matchId;
        knownDataVersion  = r.dataVersion;
        setProgress       = r.setProgress || {};
        stats             = r.stats;
        firstLoadDone     = true;
        updateCurrentMatchLocked();
        updateMatchBtnLabel();
        updateHeaderSetBar();
        renderAll();
        updateTabbarOffset();
        maybePromptTodayMatch();
        startSetSync();
      })
      .withFailureHandler(function(e) { firstLoadDone = true; onStatsError(e); })
      .initialLoad(null);
  } catch(e) {
    loadMatches(); // older server without initialLoad
  }
}

window.onload = function() {
  bootstrap();
  updateTabbarOffset();
};
</script>
</body>
</html>
